name: Bug report
description: Something in Taku OS does not work as expected.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please cover one problem per issue.

        - Do not report vulnerabilities here. Follow the [security policy](https://github.com/Taku-OS/taku-os/blob/main/SECURITY.md).
        - For a result on a specific app, use the [compatibility report](https://github.com/Taku-OS/taku-os/issues/new?template=compatibility-report.yml).
        - Remove accounts, tokens and personal data from logs and screenshots.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Your best guess is fine.
      options:
        - Agent app
        - Assistant, Home or task service
        - Agent runtime or model connection
        - Memory
        - Plugins or Skills
        - Input method
        - Proactive suggestions
        - Surfaces or widgets
        - Display or background screens
        - SDK, CLI or protocol
        - System image, OTA or Updater
        - Build or tooling
        - Documentation
        - Other or not sure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what is wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands or taps, starting from a clean state.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the exact error text.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: Did this work before?
      options:
        - "Yes, on the build named below"
        - "No, it never worked"
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: environment_type
    attributes:
      label: Where did you see it?
      options:
        - Physical device
        - Emulator
        - Development machine, no device
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Taku OS version and build, or source commit
      description: "On a device, `adb shell getprop ro.taku.product.version` and `adb shell getprop ro.build.display.id`. In a checkout, `git rev-parse HEAD`."
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or AVD
      placeholder: "Device model or AVD name, Android version, API level, ABI."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Text is pasted as a code block.
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Anything else
      description: Workarounds you found, or what you already ruled out.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed accounts, tokens and personal data.
          required: true
