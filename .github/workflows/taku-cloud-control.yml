name: Taku OS Cloud Build & Release
run-name: taku-cloud-release:${{ inputs.operation || 'manual-sync' }}:${{ inputs.request_id || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'sync-release publishes ROM/emulator GitHub Releases; status/start/stop controls taku-os-builder VM'
        type: choice
        options: [sync-release, status, start, stop]
        required: true
        default: sync-release
      request_id:
        description: 'Unique request UUID (required for status / start / stop)'
        type: string
        required: false
      full_ota_url:
        description: 'Optional immutable https://worker.taku.ai/.../full.zip URL (blank = auto-discover from canary)'
        type: string
        required: false
      full_ota_bytes:
        description: 'Expected full.zip byte size (when full_ota_url is set)'
        type: string
        required: false
      full_ota_sha256:
        description: 'Expected full.zip SHA-256 (when full_ota_url is set)'
        type: string
        required: false
      version:
        description: 'Product version X.Y.Z, e.g. 1.4.0 (when full_ota_url is set)'
        type: string
        required: false
      source_commit:
        description: 'Optional 40-char source commit SHA'
        type: string
        required: false
      prerelease:
        description: 'Mark newly created GitHub Release as pre-release'
        type: boolean
        required: false
        default: false
      clobber:
        description: 'Overwrite existing GitHub Release assets/notes if tag exists'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: taku-cloud-builder-and-release-${{ inputs.operation || 'sync-release' }}
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation != 'sync-release' &&
      github.ref == 'refs/heads/main' &&
      github.repository_id == '1462376421' &&
      github.repository_owner_id == '242648642'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate the fixed request before authentication
        env:
          OPERATION: ${{ inputs.operation }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 scripts/cloud-builder-control.py --validate-only
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.TAKU_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.TAKU_GCP_BUILDER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Control only the pinned builder
        env:
          OPERATION: ${{ inputs.operation }}
          REQUEST_ID: ${{ inputs.request_id }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 scripts/cloud-builder-control.py
          # Validated VM identity and public endpoint only; no credentials.
          cat out/cloud-control/endpoint.json

  sync-release:
    if: >-
      github.repository == 'Taku-OS/taku-os' &&
      github.repository_id == '1462376421' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'sync-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Extract matching recovery stack and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_FULL_URL: ${{ inputs.full_ota_url }}
          INPUT_FULL_BYTES: ${{ inputs.full_ota_bytes }}
          INPUT_FULL_SHA256: ${{ inputs.full_ota_sha256 }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_CLOBBER: ${{ inputs.clobber }}
        run: |
          set -euo pipefail
          args=(--publish-github --include-full-ota --repo "$GITHUB_REPOSITORY")
          if [ "${INPUT_PRERELEASE:-false}" = "true" ]; then
            args+=(--prerelease)
          fi
          if [ "${INPUT_CLOBBER:-false}" = "true" ]; then
            args+=(--clobber)
          fi
          if [ -n "${INPUT_SOURCE_COMMIT:-}" ]; then
            args+=(--source-commit "$INPUT_SOURCE_COMMIT")
          fi
          if [ -n "${INPUT_FULL_URL:-}" ]; then
            args+=(
              --full-url "$INPUT_FULL_URL"
              --full-bytes "$INPUT_FULL_BYTES"
              --full-sha256 "$INPUT_FULL_SHA256"
              --version "$INPUT_VERSION"
            )
          else
            args+=(--from-canary)
          fi
          python3 scripts/publish-rom-release.py "${args[@]}"
