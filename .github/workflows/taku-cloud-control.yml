name: Taku cloud builder control
run-name: taku-cloud-control:${{ inputs.operation }}:${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [status, start, stop]
        required: true
        default: status
      request_id:
        description: Unique request UUID; keep it when resuming an existing request
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: taku-cloud-builder-control
  cancel-in-progress: false
jobs:
  control:
    if: github.ref == 'refs/heads/main' && github.repository_id == '1412391504' && github.repository_owner_id == '242648642'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate the fixed request before authentication
        env:
          OPERATION: ${{ inputs.operation }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 scripts/cloud-builder-control.py --validate-only
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.TAKU_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.TAKU_GCP_BUILDER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Control only the pinned builder
        env:
          OPERATION: ${{ inputs.operation }}
          REQUEST_ID: ${{ inputs.request_id }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/cloud-builder-control.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: taku-builder-endpoint-${{ inputs.request_id }}
          path: out/cloud-control/endpoint.json
          if-no-files-found: error
          retention-days: 3
