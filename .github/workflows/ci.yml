name: source-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm run verify
      - run: bash -n scripts/build-android.sh && sh -n core/device-probe.sh core/taku-device.sh
      - run: python3 tests/cloud-builder-control.test.py
      - run: python3 tests/secret-scan.test.py
      - name: Audit Frida build tooling lockfile
        run: npm --prefix examples/godmode/rea-provider/frida audit --package-lock-only
  app-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm --prefix tooling/app-kit/api ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tooling/app-kit/api test
  agent-app:
    # Dependency/source checks and native Home compilation/JVM tests; no installation.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: system/agent-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: system/agent-app/package-lock.json
      # Fails on npm releases that predate the package.json "allowScripts" policy,
      # before any dependency install script can run.
      - run: npm approve-scripts --allow-scripts-pending
      - run: node scripts/check-dependency-lock.cjs
      # Verify packages before executing dependency code; skip generic install hooks.
      # The approved native grammar hook runs explicitly before native compilation.
      - run: npm ci --ignore-scripts --no-fund
      - name: npm audit (all severities, reviewed temporary exception)
        run: node scripts/audit-dependencies.cjs
      - run: npm audit signatures
      - run: npm run patch:markdown
      - run: npm run prepare:feed-assets
      - run: node scripts/patch-enriched-markdown.cjs --check
      - run: node node_modules/expo/bin/cli install --check
      - run: npm run doctor
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Verify waived tooling is absent from the Android bundle
        run: npm run check:audit-boundary
      # Runs the config plugins (Gradle checksum pin, manifest, fonts) against the SDK
      # template. Generates android/ only; no Gradle build or Android SDK needed.
      - run: node node_modules/expo/bin/cli prebuild --platform android --no-install
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm rebuild react-native-enriched-markdown
      - run: npm run patch:markdown
      - name: Compile native character entry and run Home JVM regressions
        run: cd android && ./gradlew :taku-home:compileReleaseKotlin :taku-home:testDebugUnitTest --console=plain --max-workers=2
      - name: Retain complete dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-app-dependency-audit
          path: system/agent-app/out/security/*.json
          retention-days: 30
          if-no-files-found: warn
  plugin-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: /bin/bash system/plugins/test.sh
      - run: /bin/bash system/plugins/test-host.sh
  android-plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash system/plugins/build-android.sh
      - name: Verify packaged DEX and development APK
        run: |
          unzip -l system/plugins/out/taku-godmode-host.jar | grep 'classes.dex'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify system/plugins/out/TakuGodMode.apk
  tryon:
    # Source build and bounded lifecycle fixtures; no install or model session.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm run check:tryon
      - run: python3 system/tryon/app/prepare-native-deps.py --download
      - run: npm run build:tryon
      - run: bash system/tryon/test-rtc-cleanup.sh
      - run: bash -n system/tryon/app/build.sh system/tryon/test-host.sh system/tryon/test-rtc-cleanup.sh
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        run: |
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: python3 tests/secret-scan.test.py
      - name: Scan introduced changes without printing secrets
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.sha }}
        run: bash scripts/ci-secret-scan.sh
# These jobs compile the plugin Android component and check the builder control scripts.
# The ROM builder image is built and checked on the build machines, not in push CI
# (see image/builder/README.md). Full ROM builds, installation and device acceptance
# remain separate evidence.
