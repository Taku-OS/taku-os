<!doctype html><meta charset="utf-8">
<style>body{font:13px/1.5 system-ui;margin:18px}h1{font-size:16px}input{width:100%;margin:8px 0}button{padding:9px 16px}p{overflow-wrap:anywhere}small{color:#666}</style>
<h1>Taku Figma Desktop Bridge</h1>
<label>Load private plugin session<input id="config" type="file" accept=".json"></label>
<button id="connect" disabled>Connect</button>
<p id="status" role="status">Load the session file generated by the loopback relay.</p>
<small>One configured file. Declarative native layers; click and timed transitions only.</small>
<script id="bridge-transport">
// This class is also exercised in a host VM without Figma, credentials, or sockets.
class BridgeTransport {
  constructor({call, send, status, now = Date.now, retryMs = 10000}) {
    Object.assign(this, {call, send, status, now, retryMs});
    this.running = false; this.polling = false; this.pending = null;
    this.receipt = null; this.last = ''; this.sentAt = 0;
  }
  connect() { this.running = true; this.status('Connected. Waiting for phone Agent.'); }
  stop() { this.running = false; this.status('Stopped. Reconnect to resume the same pending operation.'); }
  async tick() {
    if (!this.running || this.polling) return;
    this.polling = true;
    try {
      if (this.receipt) {
        const receipt = this.receipt;
        await this.call(receipt.type === 'ack' ? '/ack' : '/error',
          receipt.type === 'ack' ? receipt.ack : {requestId: receipt.requestId, error: receipt.error});
        this.last = receipt.requestId; this.pending = null; this.receipt = null;
        this.status(receipt.type === 'ack' ? `${receipt.ack.action} complete · ${receipt.ack.executedAt}` : receipt.error);
      }
      const state = await this.call('/state');
      if (!this.running) return;
      const request = state.request;
      if (!request || request.requestId === this.last) return;
      if (state.ack?.requestId === request.requestId || state.error != null) {
        this.last = request.requestId; this.pending = null;
        this.status(state.error == null ? 'Previous operation acknowledged.' : String(state.error));
        return;
      }
      if (this.pending && this.pending.requestId !== request.requestId) throw Error('Relay changed a pending request. Reopen the plugin to reconcile.');
      if (!this.pending || this.now() - this.sentAt >= this.retryMs) {
        this.pending = request; this.sentAt = this.now();
        // The plugin caches receipts by requestId. Retrying this exact request does not repeat writes.
        this.send({type: 'execute', request});
      }
    } catch (error) {
      if (error.status === 401) this.running = false;
      this.status(error.message);
    } finally { this.polling = false; }
  }
  receive(message) {
    if (!this.pending || !message) return;
    const id = message.type === 'ack' ? message.ack?.requestId : message.requestId;
    if (id !== this.pending.requestId) return;
    if (message.type === 'ack') this.receipt = {...message, requestId: id};
    else if (message.type === 'error') this.receipt = {type: 'error', requestId: id, error: String(message.error).slice(0, 500)};
    // Retain receipts even when Stop is clicked; the next Connect retries delivery.
    if (this.receipt && this.running) void this.tick();
  }
}
</script>
<script>
let config = null;
const status = document.getElementById('status'), connect = document.getElementById('connect');
async function call(path, data) {
  const response = await fetch(config.endpoint + path, {
    method: data ? 'POST' : 'GET', redirect: 'error',
    headers: {Authorization: 'Bearer ' + config.token, ...(data ? {'Content-Type': 'application/json'} : {})},
    body: data ? JSON.stringify(data) : undefined});
  const result = await response.json();
  if (!response.ok) { const error = Error(result.error || 'Relay request failed'); error.status = response.status; throw error; }
  if (path === '/state' && result.target?.fileKey !== config.fileKey) throw Error('Relay target differs from this session.');
  return result;
}
const transport = new BridgeTransport({call, send: message => parent.postMessage({pluginMessage: message}, '*'),
  status: message => { status.textContent = message; connect.textContent = transport.running ? 'Stop' : 'Connect'; }});
document.getElementById('config').onchange = async event => {
  try {
    if (transport.running || transport.pending) throw Error('Finish the pending operation or reopen the plugin before changing sessions.');
    const file = event.target.files[0];
    if (!file || file.size > 8192) throw Error('Invalid session file.');
    const candidate = JSON.parse(await file.text());
    if (!['http://127.0.0.1:8792', 'http://localhost:8792'].includes(candidate.endpoint)
        || !/^[-A-Za-z0-9]{1,100}$/.test(candidate.fileKey)
        || !/^[-A-Za-z0-9_]{32,128}$/.test(candidate.token)) throw Error('Invalid plugin session.');
    config = candidate; connect.disabled = false; status.textContent = 'Loaded. Click Connect.';
  } catch (error) { status.textContent = error.message; }
};
connect.onclick = () => { if (transport.running) transport.stop(); else { transport.connect(); void transport.tick(); } };
onmessage = event => { if (event.source === parent) transport.receive(event.data?.pluginMessage); };
setInterval(() => void transport.tick(), 800);
</script>
