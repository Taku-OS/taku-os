<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taku · 视觉跟踪</title><link rel="stylesheet" href="/follow-demo.css"><script type="module" src="/follow-demo.js"></script><link rel="stylesheet" href="/design-system.css"></head>
<body><main>
<header><a class="brand" href="/">taku<span> / GO2</span></a><button id="language" type="button">EN</button></header>
<section class="task-heading"><p class="eyebrow">TAKU VISION / FOLLOW</p><h1 data-copy="title"></h1></section>
<div id="scene-shortcuts"><button id="scene-go" type="button">Go handle him for me. ↗</button></div>
<section class="conversation" id="conversation"><p id="user-message" hidden></p><div class="assistant-message"><span class="assistant-mark" aria-hidden="true">✳</span><p id="reply" role="status" aria-live="polite"></p></div></section>
<section id="scene-strip" hidden><span class="scene-ring" aria-hidden="true"></span><strong id="scene-phase"></strong><span id="scene-task"></span></section>
<div id="scene-actions" role="group" aria-label="Task actions" hidden><span id="scene-processing" role="status" hidden><span class="command-dot" aria-hidden="true"></span><span id="scene-processing-text">Processing your command…</span></span><button id="scene-stay" type="button" aria-pressed="false">Stay</button><button id="scene-circle" type="button" aria-pressed="false">Circle ↻</button><button id="scene-return" type="button">Come back. ↙</button></div>
<section class="view-card" aria-labelledby="view-title"><div class="view-heading"><span id="view-title" data-copy="view"></span><span id="live-state"></span></div>
<div class="view-stage"><canvas id="video" width="960" height="540"></canvas><canvas id="tracking" width="960" height="540" tabindex="0"></canvas><div id="empty-view"></div></div>
<div class="view-footer"><span id="target-state"></span><button id="reselect" type="button" data-copy="reselect"></button></div></section>
<section id="auto-control" hidden aria-live="polite"><div><strong data-copy="auto"></strong><p><span id="auto-state"></span> <span id="auto-speed"></span></p></div><button id="auto-stop" type="button" data-copy="autoStop"></button></section>
<section id="visual-guidance" aria-live="polite"><div class="guidance-heading"><span id="guidance-label">AI guidance</span><span id="guidance-source"></span><button id="scene-calibrate" type="button" hidden>Set distance</button></div><h2 id="guidance-title"></h2><p id="guidance-reason"></p><div class="guidance-details"><span id="guidance-pace"></span><span id="guidance-range"></span></div></section>
<section id="scene-voice" hidden><div class="scene-voice-heading"><span>GO2 VOICE</span><span id="scene-voice-status"></span></div><div class="scene-voice-picker" role="group" aria-label="Choose a sound"><button id="scene-line" type="button" aria-pressed="true">Voice line</button><button id="scene-bark" type="button" aria-pressed="false">Dog bark · 5.4s</button></div><p id="scene-voice-caption">“Talking to you? I’m enough.”</p><div class="scene-voice-actions"><button id="scene-speak" type="button">Say it</button><button id="scene-audio-stop" type="button" hidden>Stop audio</button><button id="scene-preview" type="button">Phone preview</button><button id="scene-prepare" type="button">Load onto Go2</button></div></section>
<section class="insights">
<div class="distance-card"><div class="card-heading"><span data-copy="distance"></span><button id="calibrate" type="button" data-copy="calibrate"></button></div><strong id="distance-state">—</strong><small id="distance-detail"></small></div>
</section><p class="hint" id="tracking-hint"></p>
<form id="command-form"><label for="command" class="sr-only" data-copy="inputLabel"></label><div class="composer"><input id="command" type="text" maxlength="800" autocomplete="off" enterkeyhint="send"><button id="send" type="submit" data-copy="send"></button></div></form>
<dialog id="calibration-dialog" aria-labelledby="calibration-title"><form id="calibration-form"><h2 id="calibration-title" data-copy="calibrationTitle"></h2><p data-copy="calibrationHint"></p><label><input id="known-distance" type="number" inputmode="decimal" min=".5" max="10" step=".1" value="2" required><span data-copy="meters"></span></label><p id="calibration-error" role="status"></p><div class="dialog-actions"><button id="calibration-cancel" type="button" data-copy="cancel"></button><button type="submit" data-copy="save"></button></div></form></dialog>
</main></body></html>
