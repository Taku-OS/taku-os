<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/navigator.css"><script src="/geo-projection.js" defer></script><script src="/navigator.js" defer></script><link rel="stylesheet" href="/design-system.css"></head>
<body class="navigator-page"><main>
<header><div><span class="eyebrow">TAKU / GO2</span><h1 data-t="title"></h1></div><a href="/" data-t="overview"></a><button id="language">EN / 中文</button></header>
<p class="notice" data-t="notice"></p>
<section class="proposal"><span data-t="proposal"></span><div class="values"><strong id="speed">0.00</strong><span>m/s</span><strong id="turn">0.00</strong><span>rad/s</span></div><p id="reason" role="status"></p></section>
<section class="positions"><article><h2 data-t="phone"></h2><p id="phone"></p></article><article><h2 data-t="robot"></h2><p id="robot"></p></article></section>
<section><h2 data-t="route"></h2><form id="route-form"><label><span data-t="origin"></span><input id="origin" value="robot" required maxlength="120"></label><label><span data-t="destination"></span><input id="destination" required maxlength="120"></label><label><span data-t="city"></span><input id="city" maxlength="40"></label><button data-t="plan"></button></form><p id="route-result"></p><canvas id="map" width="600" height="400" hidden></canvas><p class="muted" data-t="mapLegend"></p><div class="actions"><button id="prepare" data-t="prepare"></button><button id="sensors" data-t="sensors"></button></div><p id="operation" role="status"></p></section>
<section><h2 data-t="perception"></h2><canvas id="camera" width="640" height="360"></canvas><p id="vision"></p><p id="sensors-status" class="muted"></p><p class="muted" data-t="scope"></p></section>
<details><summary data-t="calibration"></summary><p class="muted" data-t="calibrationHelp"></p><form id="anchor-form"><label><span data-t="longitude"></span><input id="longitude" type="number" step="any" min="-180" max="180"></label><label><span data-t="latitude"></span><input id="latitude" type="number" step="any" min="-75" max="75"></label><label><span data-t="accuracy"></span><input id="accuracy" type="number" min="0.05" max="100" step="any"></label><label><span data-t="heading"></span><input id="heading" type="number" min="0" max="359.999" step="any" required></label><label><span data-t="headingAccuracy"></span><input id="headingAccuracy" type="number" min="0.5" max="90" step="any" required></label><label><span data-t="floor"></span><input id="floorZ" type="number" min="-100" max="100" step="any" required></label><label class="check"><input id="colocated" type="checkbox"><span data-t="colocated"></span></label><div class="actions"><button data-t="surveyed"></button><button type="button" id="phone-anchor" data-t="phoneAnchor"></button><button type="button" id="clear" data-t="clear"></button></div></form></details>
<p class="muted" data-t="boundary"></p>
</main></body></html>
