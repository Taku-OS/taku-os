<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>Go2 · My Device</title>
    <link rel="stylesheet" href="/panel.css" />
    <script src="/panel.js" defer></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <defs>
        <symbol id="icon-wifi" viewBox="0 0 24 24">
          <path
            d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 16a5 5 0 0 1 6 0"
          />
          <circle cx="12" cy="20" r=".8" />
        </symbol>
        <symbol id="icon-battery" viewBox="0 0 24 24">
          <rect x="2" y="6" width="17" height="12" rx="3" />
          <path d="M22 10v4M6 10v4m4-4v4m4-4v4" />
        </symbol>
        <symbol id="icon-lock" viewBox="0 0 24 24">
          <rect x="5" y="10" width="14" height="11" rx="3" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
        </symbol>
        <symbol id="icon-power" viewBox="0 0 24 24">
          <path d="M12 2v10M6 5a9 9 0 1 0 12 0" />
        </symbol>
        <symbol id="icon-skills" viewBox="0 0 24 24">
          <path
            d="m12 2 2.8 6.2L22 11l-7.2 2.8L12 21l-2.8-7.2L2 11l7.2-2.8L12 2Z"
          />
        </symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24">
          <path d="m12 2 8.6 5v10L12 22l-8.6-5V7L12 2Z" />
          <circle cx="12" cy="12" r="3.5" />
        </symbol>
        <symbol id="icon-camera" viewBox="0 0 24 24">
          <rect x="2" y="6" width="14" height="13" rx="3" />
          <path d="m16 10 6-3v11l-6-3M6 3h6" />
          <circle cx="7" cy="11" r="1" />
        </symbol>
        <symbol id="icon-sound" viewBox="0 0 24 24">
          <path d="M3 10v4m4-8v12m5-15v18m5-15v12m4-8v4" />
        </symbol>
        <symbol id="icon-move" viewBox="0 0 24 24">
          <path
            d="M12 2v20M2 12h20M8 6l4-4 4 4M8 18l4 4 4-4M6 8l-4 4 4 4M18 8l4 4-4 4"
          />
        </symbol>
        <symbol id="icon-radar" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="5" />
          <path d="m12 12 7-7M12 12V3" />
          <circle cx="12" cy="12" r="1" />
        </symbol>
        <symbol id="icon-navigation" viewBox="0 0 24 24">
          <path d="m12 2 9 19-9-5-9 5 9-19Z" />
        </symbol>
        <symbol id="icon-shield" viewBox="0 0 24 24">
          <path d="m12 2 9 4v6c0 5-6 9-9 10-3-1-9-5-9-10V6l9-4Z" />
          <path d="m8 12 3 3 5-6" />
        </symbol>
        <symbol id="icon-arrow" viewBox="0 0 24 24">
          <path d="M5 12h14m-5-5 5 5-5 5" />
        </symbol>
        <symbol id="icon-close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M6 18 18 6" />
        </symbol>
        <symbol id="icon-info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v6m0-10v1" />
        </symbol>
      </defs>
    </svg>
    <main>
      <header class="topline">
        <h1 data-copy="myDevice">My Device</h1>
        <div class="top-actions">
          <button id="language" class="language" aria-label="切换到中文">
            中文</button
          ><span class="device-model">GO2 PRO</span>
        </div>
      </header>
      <section class="hero" aria-label="Unitree Go2">
        <p class="hero-title">ROBOT DOG</p>
        <img
          src="/robot.png"
          alt="Unitree Go2 robot dog"
          width="1024"
          height="1024"
          draggable="false"
        /><span class="hero-caption">UNITREE × TAKU</span>
      </section>
      <section class="status-grid" aria-label="Device status">
        <button id="connection" class="status-pill">
          <svg><use href="#icon-wifi" /></svg
          ><span
            ><i id="status-dot"></i
            ><span id="connection-label">Checking</span></span
          ></button
        ><button class="status-pill" data-page="state">
          <svg><use href="#icon-battery" /></svg
          ><span id="battery-value">—</span></button
        ><button id="control-lock" class="status-pill">
          <svg><use href="#icon-lock" /></svg
          ><span id="lock-label">Locked</span>
        </button>
      </section>
      <nav class="control-bar" aria-label="Device controls">
        <button id="skills">
          <svg><use href="#icon-skills" /></svg
          ><span data-copy="skills">Skills</span></button
        ><button id="power" class="power" aria-label="Connect robot">
          <svg><use href="#icon-power" /></svg></button
        ><button id="settings">
          <svg><use href="#icon-settings" /></svg
          ><span data-copy="settings">Settings</span>
        </button>
      </nav>
      <p
        id="connection-note"
        class="connection-note"
        role="status"
        aria-live="polite"
      ></p>
      <section class="features">
        <div class="section-heading">
          <h2 data-copy="yourRobot">Your robot, your way.</h2>
          <span data-copy="sixSkills">6 SKILLS</span>
        </div>
        <div class="feature-grid">
          <button class="feature camera-feature" data-page="follow_view">
            <span class="feature-top"
              ><svg><use href="#icon-camera" /></svg
              ><span class="feature-badge" data-copy="vision"
                >VISION</span
              ></span
            ><span class="feature-bottom"
              ><span
                ><strong data-copy="camera">Live Camera</strong
                ><small data-copy="cameraNote">See, track & guide</small></span
              ><svg class="arrow"><use href="#icon-arrow" /></svg
            ></span>
          </button>
          <button class="feature sound-feature" data-page="audio">
            <span class="feature-top"
              ><svg><use href="#icon-sound" /></svg
              ><span class="feature-badge" data-copy="onPhone"
                >ON PHONE</span
              ></span
            ><span class="feature-bottom"
              ><span
                ><strong data-copy="sounds">Voice & Sounds</strong
                ><small data-copy="soundsNote"
                  >Presets, playback & volume</small
                ></span
              ><svg class="arrow"><use href="#icon-arrow" /></svg
            ></span>
          </button>
          <button class="feature" data-page="motion">
            <span class="feature-top"
              ><svg><use href="#icon-move" /></svg></span
            ><span class="feature-bottom"
              ><span
                ><strong data-copy="move">Movement</strong
                ><small data-copy="moveNote">Direction & pace</small></span
              ><svg class="arrow"><use href="#icon-arrow" /></svg
            ></span>
          </button>
          <button class="feature" data-page="environment">
            <span class="feature-top"
              ><svg><use href="#icon-radar" /></svg></span
            ><span class="feature-bottom"
              ><span
                ><strong data-copy="surroundings">Surroundings</strong
                ><small data-copy="surroundingsNote"
                  >Live LiDAR view</small
                ></span
              ><svg class="arrow"><use href="#icon-arrow" /></svg
            ></span>
          </button>
          <button class="feature" data-page="navigator">
            <span class="feature-top"
              ><svg><use href="#icon-navigation" /></svg></span
            ><span class="feature-bottom"
              ><span
                ><strong data-copy="navigate">Navigation</strong
                ><small data-copy="navigateNote"
                  >Location & route planning</small
                ></span
              ><svg class="arrow"><use href="#icon-arrow" /></svg
            ></span>
          </button>
          <button class="feature" data-page="avoidance">
            <span class="feature-top"
              ><svg><use href="#icon-shield" /></svg></span
            ><span class="feature-bottom"
              ><span
                ><strong data-copy="avoidance">Obstacle Assist</strong
                ><small data-copy="avoidanceNote"
                  >Clearance & safeguards</small
                ></span
              ><svg class="arrow"><use href="#icon-arrow" /></svg
            ></span>
          </button>
        </div>
      </section>
      <button class="device-details" data-page="state">
        <span
          ><svg><use href="#icon-info" /></svg
          ><span data-copy="deviceDetails">Device details</span></span
        ><span id="details-caption">Go2 Pro</span
        ><svg class="arrow"><use href="#icon-arrow" /></svg>
      </button>
      <p class="footer-note" data-copy="local">
        Connected locally. Made for your Go2.
      </p>
    </main>
    <dialog id="sheet">
      <div class="sheet-heading">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" aria-label="Close">
          <svg><use href="#icon-close" /></svg>
        </button>
      </div>
      <p id="sheet-description"></p>
      <div id="sheet-content"></div>
      <div id="sheet-actions"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
