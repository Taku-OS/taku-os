<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taku OS · Agent screenshots</title><link rel="icon" href="data:,"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1512;color:#eef3ed;font:14px/1.5 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:14px 12px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}h1{font-size:16px;margin:0}small{font-size:11px;color:#a6b6ad}select{width:100%;height:42px;background:#1b2821;border:1px solid #34453a;border-radius:10px;color:#eef3ed;padding:0 10px;font:inherit}p{font-size:12px;margin:10px 0;color:#a6b6ad}img{display:block;width:100%;height:auto;border-radius:16px}a{color:#b0ead1}.viewer{margin-top:8px}.tip{margin-bottom:0}
</style></head><body><main><header><h1>Taku OS · Agent</h1><small>Actual emulator screenshots</small></header><select id="choose" aria-label="Choose screenshot"><option value="skills.png">Skills · Compact list</option><option value="harness.png">Harness · Seven-module overview</option><option value="module.png">Harness · Expanded module text</option><option value="environment.png">Harness · Actual environment data</option><option value="receipt.png">Harness · Execution receipt</option><option value="harness-light.png">Harness · Light theme</option><option value="skills-light.png">Skills · Light theme</option></select><p id="caption">Eight skills are fully visible on one screen, with search and filters retained.</p><a class="viewer" id="original" href="skills.png" target="_blank" rel="noopener"><img id="shot" src="skills.png" alt="Actual screenshot of the compact Skills list"></a><p class="tip">Click an image to open and enlarge the original. The page retains Workspace Portal login protection.</p></main><script>
const descriptions={"skills.png":"Eight skills are fully visible on one screen, with search and filters retained.","harness.png":"Seven modules fit entirely on one screen; context, environment, and receipts expand on demand.","module.png":"Expand to view actual source, version, hash, and module text.","environment.png":"Expand actual OS and runtime environment JSON.","receipt.png":"View execution receipts associated with actual native turns.","harness-light.png":"Harness light theme at the same density.","skills-light.png":"Skills light theme at the same density."};document.getElementById('choose').addEventListener('change',event=>{const file=event.target.value;if(!descriptions[file])return;document.getElementById('shot').src=file;document.getElementById('shot').alt=event.target.selectedOptions[0].textContent;document.getElementById('original').href=file;document.getElementById('caption').textContent=descriptions[file];});
</script></body></html>
